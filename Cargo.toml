[workspace]
resolver = "2"
members = [
    "crates/vmpx-cli",
    "crates/vmpx-detect",
    "crates/vmpx-emulate",
    "crates/vmpx-disasm",
    "crates/vmpx-pe",
    "crates/vmpx-rebuild",
    "crates/vmpx-recompile",
    "crates/vmpx-ui",
    "crates/vmpx-unpack",
    "crates/vmpx-vm",
    "crates/vmpx-vmlift",
    "crates/vmpx-vtil-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
lzma-rs = "0.3"
iced-x86 = "1.21"

# Faster dev/test builds: drop debuginfo for deps entirely (we never debug into
# egui/iced-x86/etc.) and keep only line tables for our own crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
